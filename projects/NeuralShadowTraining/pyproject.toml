[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdw-neural-shadows"
version = "1.0.0"
description = "Dataset, spatial-visibility model, export, and validation tools for DFramework neural shadows"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "onnx>=1.16", "onnxruntime>=1.18", "torch>=2.3"]

[project.scripts]
fdw-neural-shadows = "fdw_neural_shadows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
